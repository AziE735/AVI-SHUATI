<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自测AVI刷题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{max-width:700px;margin:20px auto;padding:0 15px;background:#f5f7fa}
.box{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #00000010}
.question-title{font-size:18px;font-weight:500;margin-bottom:12px}
.opt{display:block;padding:10px 14px;border:1px solid #ddd;border-radius:8px;margin:8px 0;cursor:pointer}
.opt.active{border-color:#2563eb;background:#eff6ff}
/*选项内图片样式，适配手机，不会撑爆页面*/
.opt-img{max-width:120px;max-height:100px;margin-top:6px;border:1px solid #eee;border-radius:4px}
.btn{padding:12px 24px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin:8px 4px}
.wrong{border-left:4px solid #ef4444;padding:12px;border-radius:8px;margin:8px 0;background:#fff}
.right{border-left:4px solid #22c55e}
.analysis{margin-top:10px;color:#666;font-size:14px}
#startBox,#resultBox{text-align:center;padding:40px 20px}
.tip-text{font-size:20px;font-weight:bold;margin:12px 0}
.tip-fail{color:#ef4444}
.tip-pass{color:#22c55e}
</style>
</head>
<body>
<div id="startBox" class="box">
  <h2>FQC AVI刷题</h2>
  <p style="margin:16px 0">开始刷题，祝你答的全会，蒙的全对</p>
  <br><br>
  <button class="btn" onclick="startExam()">开始刷题</button>
</div>
<div id="examBox" style="display:none">
  <div class="box">
    <div id="qTitle" class="question-title"></div>
    <div id="optWrap"></div>
    <button class="btn" onclick="prev()">上一题</button>
    <button class="btn" onclick="next()">下一题</button>
  </div>
  <div style="text-align:center;margin-top:10px">
    <button class="btn" onclick="submitPaper()">交卷评分</button>
  </div>
</div>
<div id="resultBox" class="box" style="display:none">
  <h2>答题结果</h2>
  <p id="scoreText"></p>
  <div id="msgTip" class="tip-text"></div>
  <div id="errorList"></div>
  <button class="btn" onclick="resetAll()">重新刷题</button>
</div>

{id:20,title:"AVI工作的气压力是多少？（单选题）",type:"single",opts:["0.2Mpa-0.3Mpa","0.1Mpa-0.2Mpa","0.4Mpa-0.6Mpa","0.6Mpa-0.8Mpa"],ans:"C",analysis:"AVI工作的气压力是0.4Mpa-0.6Mpa"},
{id:21,title:"关于AVI-FQC复判站说法不正确的是？（多选题）",type:"multi",opts:["AVI-FQC站为了应付产出，人员可以不确认直接点Pass","AVI-FQC开班点检设备程序命名，设备轨道状态","更换产品时，随意调取程序测试","设备报警时，第一时间确认是否因缺料报警，及时上料恢复生产"],ans:"AC",analysis:"正确答案为A、C"},
{id:22,title:"AVI-FQC复判站人员发现连续3片产品相同不良时，下列做法正确的是？（多选题）",type:"multi",opts:["复判人员仔细确认判定是真实不良，立刻停线报备领班。","为了产能不用理会，正常复判往下做。","复判人员点击NG按钮，并将不良品挑出放到不良品盘中，并报备领班处理。","复判人员点击NG按钮，无需挑出不良，直接留给盘检QC挑选，报废处理。"],ans:"AC",analysis:"正确答案为A、C"},

{id:25,title:"辰岭AVI复判站显示报警翻盘机料仓无盘，以下操作不正确的是?（多选题）",type:"multi",opts:["立刻停机检查翻盘机上料仓是否还有盘子","拉出翻盘机的料仓，放入空镜像盘。点击开始按钮继续生产","直接关闭报警提示，不用理会直接生产","立刻统计技术员处理",],ans:"CD",analysis:"正确答案为CD"},

{id:27,title:"关于AVI检测机台以下解释正确的是?（多选题）",type:"multi",opts:["AVI中文意思自动视觉检测机，主要检测产品的外观不良","AVI可以检测产品的正面和反面的不良，Dock料号可以侧面检测E75元件","AVI检测机台不可以检测产品的功能不良，产品的功能不能需要ET设备测试","AVI检测机台检测产品结束后，需要上传检测信息，保留检测的图片便于查询取证",],ans:"ABCD",analysis:"正确答案为ABCD"},
{id:28,title:"AVI机台如果没有定期保养的话，将会产生什么后果?（多选题）",type:"multi",opts:["机台平台铺满灰尘","产品测试时灰尘落入造成误报","设备丝杆运动异响","机台地脚不平，导致机台晃动",],ans:"ABC",analysis:"正确答案为ABC"},
{id:29,title:"以下不良缺陷AVI不能检测的是？（多选题）",type:"multi",opts:["柔板脱层","漏弯折","柔板漏铜","柔板损坏",],ans:"AB",analysis:"正确答案为AB"},
{id:30,title:"百世威AVI调取程序后，以下操作需要点击的是？（多选题）",type:"multi",opts:["在线编辑","在线模式","生成路径","终端连接",],ans:"BCD",analysis:"正确答案为BCD"},
{id:31,title:"以下哪些会引起真空报警,导致盘子无法吸取（多选题）",type:"multi",opts:["吸附位置tray盘损坏","吸附位置镂空","吸嘴未安装好","tray盘未到感应位置",],ans:"ABCD",analysis:"正确答案为ABCD"},

];
let pool = [];
let current = 0;
let userAnswer = {};

// 随机打乱数组
function shuffle(arr){
  let a = [...arr];
  for(let i=a.length-1;i>0;i--){
    let j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startExam(){
  // 全部题目，打乱，不再截取
  pool = shuffle(questions);
  current = 0;
  userAnswer = {};
  document.getElementById('startBox').style.display='none';
  document.getElementById('examBox').style.display='block';
  document.getElementById('resultBox').style.display='none';
  renderQ();
}

function renderQ(){
  const q = pool[current];
  document.getElementById('qTitle').innerText = `【${current+1}/${pool.length}】${q.title}`;
  let html = '';
  //简答题
  if(q.type === "essay"){
      html += `<div style="margin:8px 0;color:#2563eb">简答题，请交卷后查看参考答案</div>`;
      document.getElementById('optWrap').innerHTML = html;
      return;
  }
  q.opts.forEach((item,i)=>{
    let label = String.fromCharCode(65+i);
    let sel = userAnswer[current]?.includes(label) ? 'active' : '';
    let optInner = '';
    // 判断选项是对象（带图片）还是普通字符串
    if(typeof item === 'object' && item!==null){
      optInner += `${label}. ${item.text}`;
      // 如果有图片地址就渲染img标签
      if(item.img){
        optInner += `<br><img class="opt-img" src="${item.img}" alt="${label}选项图片">`;
      }
    }else{
      optInner += `${label}. ${item}`;
    }
    html += `<label class="opt ${sel}" onclick="selectOpt(${current},'${label}','${q.type}')">${optInner}</label>`
  })
  document.getElementById('optWrap').innerHTML = html;
}

function selectOpt(idx,label,type){
  if(type==='single' || type === 'judge' || type === 'fill'){
    userAnswer[idx] = [label];
  }else{
    if(!userAnswer[idx]) userAnswer[idx]=[];
    let arr = userAnswer[idx];
    if(arr.includes(label)){
      arr = arr.filter(x=>x!==label);
    }else{
      arr.push(label);
    }
    userAnswer[idx] = arr;
  }
  renderQ();
}

function prev(){
  if(current>0) {current--;renderQ();}
}

function next(){
  if(current < pool.length-1) {current++;renderQ();}
}

function submitPaper(){
  let score = 0;
  const perScore = 5; //每题5分
  let errHtml = '';
  //统计有效计分题目（排除简答）
  let scoreTotalCount = 0;

  pool.forEach((q,i)=>{
    //简答题不计分
    if(q.type === "essay"){
        errHtml += `<div class="box wrong">
        <div>${q.title}</div>
        <div>【简答题，无自动判分】参考答案：${q.ans}</div>
        <div class="analysis">解析：${q.analysis||'无'}</div>
        </div>`;
        return;
    }
    scoreTotalCount++;
    let u = (userAnswer[i]||[]).sort().join('');
    let right = q.ans;
    if(u === right){
      score += perScore;
    }else{
      errHtml += `<div class="box wrong"><div>${q.title}</div><div>你的答案：${u||'未作答'}</div><div>正确答案：${right}</div><div class="analysis">解析：${q.analysis||'无'}</div></div>`
    }
  })

  document.getElementById('examBox').style.display='none';
  document.getElementById('resultBox').style.display='block';
  const fullScore = scoreTotalCount * perScore;
  document.getElementById('scoreText').innerText = `得分：${score} / ${fullScore} ，共${pool.length}题，每题5分`;

  // 得分率>=90%合格
  const rate = fullScore>0 ? (score / fullScore) : 0;
  const msgDom = document.getElementById("msgTip");
  if(rate < 0.90){
      msgDom.className = "tip-text tip-fail";
      msgDom.innerText = "不合格，还得练";
  }else{
      msgDom.className = "tip-text tip-pass";
      msgDom.innerText = "合格了，你真棒！";
  }

  document.getElementById('errorList').innerHTML = errHtml || '<p style="color:green">全部答对！太棒了！</p>';
}

function resetAll(){
  document.getElementById('startBox').style.display='block';
  document.getElementById('resultBox').style.display='none';
}
</script>
</body>
</html>
